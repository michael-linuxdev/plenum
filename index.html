<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Plenum – Abstimmungs-Zwilling und Fantasy-Bundestag</title>
<meta name="description" content="Wische durch echte namentliche Abstimmungen im Bundestag, finde deinen Abstimmungs-Zwilling und stelle dein Fantasy-Team aus Abgeordneten auf.">
<meta name="theme-color" content="#f6f3ec">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

<style>
:root{
  --bg:#f6f3ec; --card:#fffdf8; --ink:#1d2433; --mute:#6b7180; --line:#e4dfd3;
  --accent:#16507a; --accent-soft:#e3edf5;
  --ja:#1f8a4c; --ja-soft:#e2f3e8; --nein:#c2412d; --nein-soft:#f8e4df;
  --enth:#b7791f; --enth-soft:#f7edd9; --weg:#9aa0ab; --weg-soft:#eceef1;
  --gold:#c8961e;
  --r:18px; --shadow:0 1px 2px rgba(29,36,51,.06),0 8px 24px rgba(29,36,51,.08);
  --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
body{min-height:100vh;padding-top:var(--safe-t)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
a{color:var(--accent)}
.wrap{max-width:560px;margin:0 auto;padding:12px 16px calc(96px + var(--safe-b))}
header.top{display:flex;align-items:center;gap:10px;padding:6px 2px 10px}
.logo{width:34px;height:34px;flex:none}
header.top h1{font-size:20px;margin:0;letter-spacing:.2px}
header.top .sub{font-size:12.5px;color:var(--mute);margin-top:-2px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(255,253,248,.96);backdrop-filter:blur(8px);border-top:1px solid var(--line);padding:6px 8px calc(6px + var(--safe-b));display:flex;justify-content:center}
nav.tabs .in{display:flex;gap:4px;max-width:560px;width:100%}
nav.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 4px;border-radius:12px;font-size:12px;color:var(--mute)}
nav.tabs button svg{width:24px;height:24px}
nav.tabs button[aria-selected="true"]{color:var(--accent);background:var(--accent-soft);font-weight:600}
.view{display:none}.view.on{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:16px}
.mt{margin-top:12px}.mt2{margin-top:20px}
.muted{color:var(--mute)}.small{font-size:13.5px}.tiny{font-size:12px}
h2{font-size:19px;margin:4px 0 8px}h3{font-size:16px;margin:0 0 6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;padding:3px 9px;border-radius:999px;background:var(--weg-soft);color:#3d4452;white-space:nowrap}
.chip.ja{background:var(--ja-soft);color:var(--ja)}.chip.nein{background:var(--nein-soft);color:var(--nein)}
.chip.enth{background:var(--enth-soft);color:var(--enth)}.chip.acc{background:var(--accent-soft);color:var(--accent)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:11px 16px;border-radius:14px;background:var(--accent);color:#fff;font-weight:600}
.btn.ghost{background:var(--accent-soft);color:var(--accent)}
.btn.line{background:transparent;border:1px solid var(--line);color:var(--ink)}
.btn.block{width:100%}
.btn:disabled{opacity:.5}
.row{display:flex;gap:10px;align-items:center}
.grow{flex:1;min-width:0}
.trunc{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* Kartenstapel */
.stack{position:relative;height:min(58vh,520px);margin-top:6px;touch-action:pan-y}
.pcard{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);padding:18px;overflow:hidden;will-change:transform;user-select:none}
.pcard.back{transform:scale(.955) translateY(12px);opacity:.75}
.pcard .meta{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12.5px;color:var(--mute)}
.pcard h2{font-size:20px;line-height:1.28;margin:10px 0 8px}
.pcard .intro{font-size:14.5px;color:#3d4452;overflow:auto;flex:1;padding-right:2px;-webkit-mask-image:linear-gradient(#000 85%,transparent);mask-image:linear-gradient(#000 85%,transparent);padding-bottom:14px}
.stamp{position:absolute;top:22px;padding:4px 12px;border:3px solid;border-radius:10px;font-weight:800;font-size:22px;letter-spacing:1px;opacity:0;transform:rotate(-12deg);pointer-events:none}
.stamp.ja{left:18px;color:var(--ja);border-color:var(--ja)}
.stamp.nein{right:18px;color:var(--nein);border-color:var(--nein);transform:rotate(12deg)}
.stamp.enth{left:50%;top:auto;bottom:24px;transform:translateX(-50%);color:var(--enth);border-color:var(--enth)}
.answer{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:12px}
.answer button{padding:12px 6px;border-radius:16px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:14px}
.answer .nein{background:var(--nein-soft);color:var(--nein)}
.answer .enth{background:var(--enth-soft);color:var(--enth)}
.answer .ja{background:var(--ja-soft);color:var(--ja)}
.answer svg{width:22px;height:22px}
.skip{display:block;margin:8px auto 0;color:var(--mute);font-size:14px;padding:6px 12px}
.progress{height:6px;background:var(--line);border-radius:6px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);border-radius:6px;transition:width .3s}

/* Auflösung */
.reveal .res{display:flex;align-items:center;gap:8px;font-weight:700;font-size:18px}
.bar{display:flex;height:12px;border-radius:8px;overflow:hidden;background:var(--weg-soft);margin:8px 0 4px}
.bar i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:12.5px;color:var(--mute)}
.legend b{color:var(--ink)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px;vertical-align:0}
.frak{display:grid;grid-template-columns:1fr auto;gap:6px 10px;margin-top:10px;font-size:14px;align-items:center}

/* Listen */
.list{display:flex;flex-direction:column}
.item{display:flex;align-items:center;gap:12px;padding:10px 2px;border-bottom:1px solid var(--line);text-align:left;width:100%}
.item:last-child{border-bottom:0}
.avatar{width:40px;height:40px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:700;font-size:14px;background:var(--accent-soft);color:var(--accent)}
.pct{font-weight:800;font-size:17px;min-width:52px;text-align:right}
.meter{height:8px;border-radius:6px;background:var(--line);overflow:hidden;margin-top:4px}
.meter i{display:block;height:100%;background:var(--accent)}
.rank{width:22px;text-align:center;color:var(--mute);font-weight:700;font-size:14px;flex:none}
input[type=search],select{width:100%;padding:11px 14px;border-radius:14px;border:1px solid var(--line);background:#fff;font:inherit;color:inherit}
.seg{display:flex;background:var(--weg-soft);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;padding:8px;border-radius:10px;font-size:14px;color:var(--mute);font-weight:600}
.seg button[aria-pressed="true"]{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}

/* Team */
.slots{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.slot{min-width:0;aspect-ratio:3/4.2;border-radius:14px;border:1.5px dashed var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:6px 4px;text-align:center;font-size:11.5px;color:var(--mute);background:var(--card);position:relative}
.slot.full{border-style:solid;border-color:var(--line);color:var(--ink)}
.slot .avatar{width:34px;height:34px;font-size:12px}
.slot .nm{font-weight:600;line-height:1.15;max-height:2.3em;overflow:hidden}
.slot .pts{font-weight:800;color:var(--accent);font-size:13px}
.slot .cap{position:absolute;top:4px;right:4px;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:12px;background:var(--weg-soft);color:var(--mute)}
.slot .cap.on{background:var(--gold);color:#fff}
.score{display:flex;align-items:baseline;gap:8px}
.score b{font-size:40px;line-height:1;letter-spacing:-1px;white-space:nowrap}
.addbtn{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);font-size:22px;font-weight:700;flex:none}
.addbtn.on{background:var(--accent);color:#fff;font-size:16px}
.addbtn:disabled{opacity:.35}
.kv{display:grid;grid-template-columns:1fr auto;gap:4px 12px;font-size:14px}
.kv span:nth-child(even){text-align:right;font-weight:600}

/* Blatt */
.sheet-bg{position:fixed;inset:0;background:rgba(20,24,33,.38);z-index:40;display:none}
.sheet{visibility:hidden;position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--card);border-radius:22px 22px 0 0;max-height:86vh;overflow:auto;padding:10px 16px calc(20px + var(--safe-b));transform:translateY(100%);transition:transform .25s ease;max-width:560px;margin:0 auto}
.sheet.on{transform:none;visibility:visible}
.sheet .grab{width:42px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 10px}
.vrow{display:grid;grid-template-columns:1fr 58px 58px;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.vrow .v{text-align:center;font-size:12px;font-weight:700;border-radius:8px;padding:3px 0}
.v.j{background:var(--ja-soft);color:var(--ja)}.v.n{background:var(--nein-soft);color:var(--nein)}.v.e{background:var(--enth-soft);color:var(--enth)}.v.x,.v.d{background:var(--weg-soft);color:var(--mute)}
.toast{position:fixed;left:50%;bottom:calc(84px + var(--safe-b));transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;z-index:60;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center}
.toast.on{opacity:1}
.banner{display:flex;gap:10px;align-items:center;background:var(--accent-soft);border-radius:14px;padding:10px 12px;font-size:14px;margin-bottom:10px}
.banner .grow{line-height:1.3}
.center{text-align:center}
.empty{padding:28px 10px;text-align:center;color:var(--mute)}
details summary{cursor:pointer;font-weight:600}
details p,details li{font-size:14px;color:#3d4452}
.loading{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:60vh;gap:14px;text-align:center}
.spinner{width:36px;height:36px;border-radius:50%;border:4px solid var(--line);border-top-color:var(--accent);animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <svg class="logo" viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="16" fill="#16507a"/><path d="M12 44a20 20 0 0 1 40 0" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round"/><path d="M20 44a12 12 0 0 1 24 0" fill="none" stroke="#9cc3e0" stroke-width="5" stroke-linecap="round"/><circle cx="32" cy="44" r="4" fill="#f2c14e"/></svg>
    <div class="grow"><h1>Plenum</h1><div class="sub" id="untertitel">Echte Abstimmungen im Bundestag</div></div>
  </header>
  <div id="installBanner"></div>
  <div id="updateBanner"></div>

  <main>
    <section class="view on" id="v-laden"><div class="loading"><div class="spinner"></div><div id="ladeText">Lade Abstimmungen …</div><div class="progress" style="width:220px"><i id="ladeBalken" style="width:5%"></i></div></div></section>
    <section class="view" id="v-zwilling"></section>
    <section class="view" id="v-ergebnis"></section>
    <section class="view" id="v-team"></section>
    <section class="view" id="v-info"></section>
  </main>
</div>

<nav class="tabs" id="tabs" hidden>
  <div class="in" role="tablist">
    <button role="tab" data-tab="zwilling" aria-selected="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="3" width="14" height="18" rx="3"/><path d="M9 8h6M9 12h6M9 16h3"/></svg>Abstimmen</button>
    <button role="tab" data-tab="ergebnis" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="8.5" cy="9" r="3.5"/><circle cx="15.5" cy="9" r="3.5"/><path d="M2.5 20c.8-3.4 3.2-5 6-5s5.2 1.6 6 5M14 15.2c.5-.1 1-.2 1.5-.2 2.8 0 5.2 1.6 6 5"/></svg>Zwilling</button>
    <button role="tab" data-tab="team" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0V4z"/><path d="M7 6H4v1a3 3 0 0 0 3 3M17 6h3v1a3 3 0 0 1-3 3"/></svg>Team</button>
    <button role="tab" data-tab="info" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg>Info</button>
  </div>
</nav>

<div class="sheet-bg" id="sheetBg"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"><div class="grab"></div><div id="sheetInhalt"></div></div>
<div class="toast" id="toast"></div>

<script type="module">
const APP_VERSION = '1.0.0';
const API = 'https://www.abgeordnetenwatch.de/api/v2/';
const TEAMGROESSE = 5, MAX_JE_FRAKTION = 2, MIN_ANTWORTEN = 5;
const LS = { antworten: 'plenum-antworten', team: 'plenum-team', kapitaen: 'plenum-kapitaen', live: 'plenum-live', auflosung: 'plenum-auflosung', install: 'plenum-install-weg' };

// ---------- kleine Helfer ----------
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const lesen = (k, d) => { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } };
const schreiben = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch { /* voll oder gesperrt */ } };
const datum = iso => { if (!iso) return ''; const [y, m, d] = iso.split('-'); return `${+d}.${+m}.${y}`; };
const initialen = n => { const w = String(n).split(/\s+/).filter(x => x && !x.endsWith('.')); return ((w[0]?.[0] || '') + (w.length > 1 ? w[w.length - 1][0] : '')).toUpperCase(); };
const prozent = x => Math.round(x * 100) + ' %';
const WORT = { j: 'Dafür', n: 'Dagegen', e: 'Enthalten', x: 'Nicht beteiligt', '.': '–' };
const KLASSE = { j: 'ja', n: 'nein', e: 'enth' };
function toast(t) { const el = $('#toast'); el.textContent = t; el.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove('on'), 2200); }
async function teilen(text, url) {
  try { if (navigator.share) { await navigator.share({ text, url }); return; } } catch (e) { if (e?.name === 'AbortError') return; }
  try { await navigator.clipboard.writeText(text + ' ' + url); toast('In die Zwischenablage kopiert'); } catch { toast(url); }
}

// ---------- Daten laden ----------
let D = null; // Rohdaten
const S = { antworten: lesen(LS.antworten, {}), team: lesen(LS.team, []), kapitaen: lesen(LS.kapitaen, null), auflosung: lesen(LS.auflosung, true) };

function ladeAnzeige(text, anteil) { $('#ladeText').textContent = text; $('#ladeBalken').style.width = Math.max(5, Math.round(anteil * 100)) + '%'; }

async function datenLaden() {
  try {
    const r = await fetch('data/bundestag.json', { cache: 'no-cache' });
    if (r.ok) { const j = await r.json(); if (j?.abstimmungen?.length) return j; }
  } catch { /* weiter */ }
  // Notlösung: direkt bei abgeordnetenwatch abrufen (nur, wenn die Daten-Datei noch fehlt)
  const cache = lesen(LS.live, null);
  if (cache && Date.now() - new Date(cache.erstellt).getTime() < 12 * 3600e3) return cache;
  ladeAnzeige('Hole Abstimmungen direkt bei abgeordnetenwatch.de …', 0.05);
  const { datenBauen } = await import('./daten.mjs');
  const holen = async pfad => { const r = await fetch(API + pfad); if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); };
  const j = await datenBauen(holen, { maxAbstimmungen: 25, warte: 1100, fortschritt: (t, a) => ladeAnzeige(t + ' …', a) });
  schreiben(LS.live, j);
  return j;
}

// ---------- Auswertung ----------
let P = [], M = [], FRAK = [], AKTIV = [], PUNKTE = null;
function vorbereiten() {
  M = D.mps;
  P = D.abstimmungen.map(a => {
    const z = { j: 0, n: 0, e: 0, x: 0 };
    const proFrak = {};
    for (let i = 0; i < a.s.length; i++) {
      const c = a.s[i]; if (c === '.') continue;
      z[c] = (z[c] || 0) + 1;
      if (c === 'x') continue;
      const f = M[i].f; (proFrak[f] ||= { j: 0, n: 0, e: 0, x: 0 })[c]++;
    }
    for (let i = 0; i < a.s.length; i++) { if (a.s[i] === 'x') { const f = M[i].f; (proFrak[f] ||= { j: 0, n: 0, e: 0, x: 0 }).x++; } }
    const mehrheit = {};
    for (const [f, c] of Object.entries(proFrak)) {
      const arr = [['j', c.j], ['n', c.n], ['e', c.e]].sort((x, y) => y[1] - x[1]);
      mehrheit[f] = arr[0][1] > 0 && arr[0][1] > arr[1][1] ? arr[0][0] : null;
    }
    return { ...a, z, proFrak, mehrheit };
  });
  const neueste = P[0]?.s || '';
  AKTIV = M.map((m, i) => i).filter(i => neueste[i] && neueste[i] !== '.');
  if (!AKTIV.length) AKTIV = M.map((m, i) => i).filter(i => !M[i].ende);
  const groesse = {};
  for (const i of AKTIV) groesse[M[i].f] = (groesse[M[i].f] || 0) + 1;
  FRAK = Object.keys(groesse).sort((a, b) => (a === 'fraktionslos') - (b === 'fraktionslos') || groesse[b] - groesse[a]);
  punkteBerechnen();
}

// Fantasy-Punkte je Abgeordnetem und Abstimmung
function punkteFuer(i, k) {
  const a = P[k], c = a.s[i];
  if (!c || c === '.' || c === 'x') return { t: 0, k: 0, w: 0, sum: 0 };
  const t = 2;
  const mh = a.mehrheit[M[i].f];
  const eig = M[i].f !== 'fraktionslos' && mh && c !== mh ? 3 : 0;
  const du = S.antworten[a.id];
  const w = du && du !== 's' && du === c ? 1 : 0;
  return { t, k: eig, w, sum: t + eig + w };
}
function punkteBerechnen() {
  PUNKTE = M.map((m, i) => {
    const r = { t: 0, k: 0, w: 0, sum: 0, n: 0 };
    for (let k = 0; k < P.length; k++) { if (P[k].s[i] === '.' || P[k].s[i] === undefined) continue; r.n++; const p = punkteFuer(i, k); r.t += p.t; r.k += p.k; r.w += p.w; r.sum += p.sum; }
    return r;
  });
}

function aehnlich(u, m) { if (u === m) return 1; if (u === 'e' || m === 'e') return 0.5; return 0; }
function beantwortet() { return P.filter(a => ['j', 'n', 'e'].includes(S.antworten[a.id])); }
function zwillinge() {
  const ant = beantwortet();
  const minUeberlapp = Math.max(3, Math.ceil(ant.length * 0.6));
  const res = [];
  for (const i of AKTIV) {
    let s = 0, n = 0;
    for (const a of ant) { const c = a.s[i]; if (c === 'j' || c === 'n' || c === 'e') { s += aehnlich(S.antworten[a.id], c); n++; } }
    if (n >= minUeberlapp) res.push({ i, q: s / n, n });
  }
  res.sort((a, b) => b.q - a.q || b.n - a.n || M[a.i].n.localeCompare(M[b.i].n));
  return { liste: res, ant };
}
function fraktionsNaehe() {
  const ant = beantwortet();
  return FRAK.filter(f => f !== 'fraktionslos').map(f => {
    let s = 0, n = 0;
    for (const a of ant) { const mh = a.mehrheit[f]; if (mh) { s += aehnlich(S.antworten[a.id], mh); n++; } }
    return { f, q: n ? s / n : 0, n };
  }).filter(x => x.n).sort((a, b) => b.q - a.q);
}

// ---------- Navigation ----------
let aktiverTab = 'zwilling';
function zeigeTab(t) {
  aktiverTab = t;
  document.querySelectorAll('.view').forEach(v => v.classList.toggle('on', v.id === 'v-' + t));
  document.querySelectorAll('#tabs button').forEach(b => b.setAttribute('aria-selected', String(b.dataset.tab === t)));
  ({ zwilling: renderZwilling, ergebnis: renderErgebnis, team: renderTeam, info: renderInfo })[t]();
  window.scrollTo({ top: 0 });
}
document.querySelectorAll('#tabs button').forEach(b => b.addEventListener('click', () => zeigeTab(b.dataset.tab)));

// ---------- Blatt (Detailansicht) ----------
function blatt(html) { $('#sheetInhalt').innerHTML = html; $('#sheetBg').style.display = 'block'; requestAnimationFrame(() => $('#sheet').classList.add('on')); }
function blattZu() { $('#sheet').classList.remove('on'); setTimeout(() => { $('#sheetBg').style.display = 'none'; }, 250); }
$('#sheetBg').addEventListener('click', blattZu);

// ---------- Tab 1: Abstimmen (Wischkarten) ----------
let offeneAufloesung = null; // id der Abstimmung, deren Ergebnis gerade gezeigt wird
function offeneKarten() { return P.filter(a => !S.antworten[a.id]); }

function ergebnisHtml(a, du) {
  const z = a.z, ges = z.j + z.n + z.e + z.x || 1;
  const w = c => (z[c] / ges * 100).toFixed(1) + '%';
  const fr = FRAK.filter(f => a.proFrak[f]).map(f => {
    const mh = a.mehrheit[f];
    const c = a.proFrak[f];
    const txt = mh ? WORT[mh] : 'uneinig';
    const kl = mh ? KLASSE[mh] : '';
    return `<span class="trunc">${esc(f)} <span class="muted tiny">${c.j}/${c.n}/${c.e}</span></span><span class="chip ${kl}">${txt}</span>`;
  }).join('');
  const deine = du && du !== 's' ? `<div class="small mt">Du: <b>${WORT[du]}</b>${['j', 'n'].includes(du) ? (du === 'j') === a.a ? ' – wie das Ergebnis' : ' – anders als das Ergebnis' : ''}</div>` : '';
  return `<div class="reveal">
    <div class="res" style="color:${a.a ? 'var(--ja)' : 'var(--nein)'}">${a.a ? '✓ Angenommen' : '✕ Abgelehnt'}</div>
    <div class="bar"><i style="width:${w('j')};background:var(--ja)"></i><i style="width:${w('n')};background:var(--nein)"></i><i style="width:${w('e')};background:var(--enth)"></i><i style="width:${w('x')};background:var(--weg)"></i></div>
    <div class="legend"><span><span class="dot" style="background:var(--ja)"></span>Dafür <b>${z.j}</b></span><span><span class="dot" style="background:var(--nein)"></span>Dagegen <b>${z.n}</b></span><span><span class="dot" style="background:var(--enth)"></span>Enthalten <b>${z.e}</b></span><span><span class="dot" style="background:var(--weg)"></span>Nicht beteiligt <b>${z.x}</b></span></div>
    ${deine}
    <div class="frak">${fr}</div>
    <div class="tiny muted mt">Zahlen je Fraktion: dafür/dagegen/enthalten</div>
  </div>`;
}

function renderZwilling() {
  const v = $('#v-zwilling');
  const alle = P.length, offen = offeneKarten(), fertig = alle - offen.length;
  const ant = beantwortet().length;
  const kopf = `<div class="row small muted"><span class="grow">${fertig} von ${alle} Abstimmungen</span>${ant >= MIN_ANTWORTEN ? `<button class="chip acc" id="zuErgebnis">Zwilling ansehen →</button>` : `<span>noch ${MIN_ANTWORTEN - ant} bis zum Zwilling</span>`}</div>
    <div class="progress mt" style="margin-top:6px"><i style="width:${alle ? fertig / alle * 100 : 0}%"></i></div>`;

  if (offeneAufloesung) {
    const a = P.find(x => x.id === offeneAufloesung);
    v.innerHTML = `${kopf}<div class="card mt"><div class="meta small muted">${datum(a.dt)}</div><h3 class="mt" style="margin-top:6px">${esc(a.t)}</h3>${ergebnisHtml(a, S.antworten[a.id])}
      ${a.u ? `<div class="mt small"><a href="${esc(a.u)}" target="_blank" rel="noopener">Mehr bei abgeordnetenwatch.de</a></div>` : ''}</div>
      <button class="btn block mt" id="weiter">${offen.length ? 'Nächste Abstimmung' : 'Fertig'}</button>`;
    $('#weiter').onclick = () => { offeneAufloesung = null; if (!offen.length) zeigeTab('ergebnis'); else renderZwilling(); };
    $('#zuErgebnis')?.addEventListener('click', () => zeigeTab('ergebnis'));
    return;
  }
  if (!offen.length) {
    v.innerHTML = `${kopf}<div class="card mt center"><h2>Alles abgestimmt</h2><p class="muted">Du hast alle ${alle} namentlichen Abstimmungen durch. Neue kommen nach jeder Sitzungswoche dazu.</p><button class="btn" id="zuE2">Meinen Zwilling ansehen</button></div>`;
    $('#zuE2').onclick = () => zeigeTab('ergebnis'); $('#zuErgebnis')?.addEventListener('click', () => zeigeTab('ergebnis'));
    return;
  }
  const [a, b] = offen;
  const karte = (x, back) => `<div class="pcard${back ? ' back' : ''}" ${back ? '' : 'id="karte"'}>
      <div class="meta"><span>${datum(x.dt)}</span><span class="chips">${x.th.slice(0, 2).map(t => `<span class="chip">${esc(t)}</span>`).join('')}</span></div>
      <h2>${esc(x.t)}</h2>
      <div class="intro">${esc(x.i) || '<span class="muted">Keine Beschreibung vorhanden.</span>'}</div>
      ${back ? '' : `<div class="stamp ja">DAFÜR</div><div class="stamp nein">DAGEGEN</div><div class="stamp enth">ENTHALTEN</div>`}
    </div>`;
  v.innerHTML = `${kopf}
    <div class="stack" id="stack">${b ? karte(b, true) : ''}${karte(a, false)}</div>
    <div class="answer">
      <button class="nein" data-a="n"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>Dagegen</button>
      <button class="enth" data-a="e"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M5 12h14"/></svg>Enthalten</button>
      <button class="ja" data-a="j"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>Dafür</button>
    </div>
    <button class="skip" data-a="s">Überspringen</button>
    ${S.antworten && Object.keys(S.antworten).length === 0 ? `<p class="tiny muted center">Wische nach rechts für Dafür, nach links für Dagegen, nach oben für Enthalten.</p>` : ''}`;
  v.querySelectorAll('[data-a]').forEach(btn => btn.addEventListener('click', () => antworten(a, btn.dataset.a, true)));
  $('#zuErgebnis')?.addEventListener('click', () => zeigeTab('ergebnis'));
  wischen($('#karte'), c => antworten(a, c, false));
}

function antworten(a, c, perKnopf) {
  const k = $('#karte');
  const fertig = () => {
    S.antworten[a.id] = c; schreiben(LS.antworten, S.antworten);
    punkteBerechnen();
    offeneAufloesung = c !== 's' && S.auflosung ? a.id : null;
    renderZwilling();
    if (beantwortet().length === MIN_ANTWORTEN && c !== 's') toast('Dein Zwilling ist bereit – Tab „Zwilling“');
  };
  if (perKnopf && k) {
    const dx = c === 'j' ? 1 : c === 'n' ? -1 : 0, dy = c === 'e' ? -1 : c === 's' ? 1 : 0;
    k.style.transition = 'transform .28s ease, opacity .28s';
    k.style.transform = `translate(${dx * 120}%, ${dy * 80}%) rotate(${dx * 14}deg)`;
    k.style.opacity = '0';
    setTimeout(fertig, 230);
  } else fertig();
}

function wischen(el, ergebnis) {
  if (!el) return;
  let x0 = 0, y0 = 0, dx = 0, dy = 0, aktiv = false;
  const st = { ja: el.querySelector('.stamp.ja'), nein: el.querySelector('.stamp.nein'), enth: el.querySelector('.stamp.enth') };
  el.addEventListener('pointerdown', e => { if (e.target.closest('a')) return; aktiv = true; x0 = e.clientX; y0 = e.clientY; dx = dy = 0; el.setPointerCapture(e.pointerId); el.style.transition = 'none'; });
  el.addEventListener('pointermove', e => {
    if (!aktiv) return;
    dx = e.clientX - x0; dy = e.clientY - y0;
    el.style.transform = `translate(${dx}px, ${Math.min(dy, 40)}px) rotate(${dx / 18}deg)`;
    st.ja.style.opacity = Math.max(0, Math.min(1, dx / 90));
    st.nein.style.opacity = Math.max(0, Math.min(1, -dx / 90));
    st.enth.style.opacity = Math.abs(dx) < 50 ? Math.max(0, Math.min(1, -dy / 90)) : 0;
  });
  const ende = () => {
    if (!aktiv) return; aktiv = false;
    let c = null;
    if (dx > 90) c = 'j'; else if (dx < -90) c = 'n'; else if (dy < -90 && Math.abs(dx) < 60) c = 'e';
    if (c) {
      el.style.transition = 'transform .25s ease, opacity .25s';
      el.style.transform = c === 'e' ? 'translate(0,-120%)' : `translate(${Math.sign(dx) * 140}%, ${dy}px) rotate(${dx / 10}deg)`;
      el.style.opacity = '0';
      setTimeout(() => ergebnis(c), 200);
    } else {
      el.style.transition = 'transform .25s ease';
      el.style.transform = '';
      Object.values(st).forEach(s => { s.style.opacity = 0; });
    }
  };
  el.addEventListener('pointerup', ende); el.addEventListener('pointercancel', ende);
}

// ---------- Tab 2: Zwilling ----------
let zwillingSuche = '';
function renderErgebnis() {
  const v = $('#v-ergebnis');
  const { liste, ant } = zwillinge();
  if (ant.length < MIN_ANTWORTEN) {
    v.innerHTML = `<div class="card center"><h2>Dein Abstimmungs-Zwilling</h2>
      <p class="muted">Stimme über mindestens ${MIN_ANTWORTEN} echte Abstimmungen ab. Dann zeigt Plenum, welche Abgeordneten tatsächlich so gestimmt haben wie du.</p>
      <div class="progress"><i style="width:${ant.length / MIN_ANTWORTEN * 100}%"></i></div><p class="small muted">${ant.length} von ${MIN_ANTWORTEN}</p>
      <button class="btn" id="losB">Los geht's</button></div>`;
    $('#losB').onclick = () => zeigeTab('zwilling');
    return;
  }
  const top = liste[0];
  const fn = fraktionsNaehe();
  const zeile = (r, rang) => {
    const m = M[r.i];
    return `<button class="item" data-mp="${r.i}">${rang ? `<span class="rank">${rang}</span>` : ''}<span class="avatar">${esc(initialen(m.n))}</span>
      <span class="grow"><span class="trunc" style="display:block;font-weight:600">${esc(m.n)}</span><span class="small muted trunc" style="display:block">${esc(m.f)}${m.w ? ' · ' + esc(m.w) : ''}</span></span>
      <span class="pct">${prozent(r.q)}</span></button>`;
  };
  const q = zwillingSuche.trim().toLowerCase();
  const gefiltert = q ? liste.filter(r => (M[r.i].n + ' ' + M[r.i].w + ' ' + M[r.i].f + ' ' + M[r.i].l).toLowerCase().includes(q)) : null;
  v.innerHTML = `
    ${top ? `<div class="card">
      <div class="small muted">Dein Abstimmungs-Zwilling</div>
      <div class="row mt" style="margin-top:8px"><span class="avatar" style="width:54px;height:54px;font-size:18px">${esc(initialen(M[top.i].n))}</span>
        <div class="grow"><div style="font-size:20px;font-weight:800;line-height:1.2">${esc(M[top.i].n)}</div><div class="small muted">${esc(M[top.i].f)}${M[top.i].w ? ' · Wahlkreis ' + esc(M[top.i].w) : ''}</div></div></div>
      <div class="score mt"><b>${prozent(top.q)}</b><span class="muted small">gleich abgestimmt, bei ${top.n} von ${ant.length} deiner Abstimmungen</span></div>
      <div class="row mt"><button class="btn ghost grow" data-mp="${top.i}">Abstimmungen vergleichen</button><button class="btn line" id="teilenZ" aria-label="Teilen">Teilen</button></div>
    </div>` : '<div class="card">Noch kein Treffer mit genug gemeinsamen Abstimmungen.</div>'}

    <div class="card mt"><h3>Nähe zu den Fraktionen</h3><p class="tiny muted" style="margin-top:0">Verglichen mit der Mehrheit jeder Fraktion bei deinen Abstimmungen.</p>
      ${fn.map(x => `<div class="mt" style="margin-top:10px"><div class="row small"><span class="grow trunc">${esc(x.f)}</span><b>${prozent(x.q)}</b></div><div class="meter"><i style="width:${x.q * 100}%"></i></div></div>`).join('')}
    </div>

    <div class="card mt"><h3>Die ${Math.min(10, liste.length)} ähnlichsten Abgeordneten</h3><div class="list">${liste.slice(0, 10).map((r, k) => zeile(r, k + 1)).join('')}</div></div>

    <div class="card mt"><h3>Am wenigsten gemeinsam</h3><div class="list">${liste.slice(-3).reverse().map(r => zeile(r, '')).join('')}</div></div>

    <div class="card mt"><h3>Abgeordnete suchen</h3><input type="search" id="zSuche" placeholder="Name, Wahlkreis oder Fraktion" value="${esc(zwillingSuche)}">
      <div class="list mt">${gefiltert ? (gefiltert.slice(0, 30).map(r => zeile(r, '')).join('') || '<div class="empty">Kein Treffer</div>') : '<div class="tiny muted">Tipp: Gib deinen Wahlkreis ein, um deine Abgeordneten zu finden.</div>'}</div></div>

    <p class="tiny muted mt">Grundlage sind nur namentliche Abstimmungen. Die meisten Beschlüsse fallen per Handzeichen und sind hier nicht enthalten. Enthaltung gegen Dafür oder Dagegen zählt halb.</p>
    <button class="btn line block mt" id="nochmal">Antworten zurücksetzen</button>`;
  v.querySelectorAll('[data-mp]').forEach(b => b.addEventListener('click', () => mpBlatt(+b.dataset.mp)));
  const zs = $('#zSuche');
  zs?.addEventListener('input', () => { zwillingSuche = zs.value; const pos = zs.selectionStart; renderErgebnis(); const n = $('#zSuche'); n.focus(); n.setSelectionRange(pos, pos); });
  $('#teilenZ')?.addEventListener('click', () => teilen(`Mein Abstimmungs-Zwilling im Bundestag: ${M[top.i].n} (${prozent(top.q)} gleich abgestimmt). Wer ist deiner?`, location.origin + location.pathname));
  $('#nochmal').onclick = () => { blatt(`<h2>Antworten zurücksetzen?</h2><p class="muted">Alle deine Antworten werden gelöscht. Dein Team bleibt.</p><div class="row"><button class="btn line grow" id="abbr">Abbrechen</button><button class="btn grow" id="jaw" style="background:var(--nein)">Zurücksetzen</button></div>`); $('#abbr').onclick = blattZu; $('#jaw').onclick = () => { S.antworten = {}; schreiben(LS.antworten, {}); punkteBerechnen(); blattZu(); zeigeTab('zwilling'); }; };
}

function mpBlatt(i) {
  const m = M[i];
  const zeilen = P.filter(a => a.s[i] && a.s[i] !== '.').map(a => {
    const du = S.antworten[a.id];
    const c = a.s[i];
    const duZelle = du && du !== 's' ? `<span class="v ${du}">${WORT[du]}</span>` : '<span class="v d">–</span>';
    return `<div class="vrow"><span>${esc(a.t)}<br><span class="tiny muted">${datum(a.dt)}</span></span>${duZelle}<span class="v ${c}">${c === 'x' ? 'Fehlt' : WORT[c]}</span></div>`;
  }).join('');
  const p = PUNKTE[i];
  const imTeam = S.team.includes(m.m);
  blatt(`<div class="row"><span class="avatar" style="width:50px;height:50px">${esc(initialen(m.n))}</span><div class="grow"><h2 style="margin:0">${esc(m.n)}</h2><div class="small muted">${esc(m.f)}${m.w ? ' · Wahlkreis ' + esc(m.w) : ''}${m.d ? ' (direkt gewählt)' : m.l ? ' · ' + esc(m.l) : ''}</div></div></div>
    <div class="kv mt"><span>Fantasy-Punkte diese Wahlperiode</span><span>${p.sum}</span><span class="muted">davon Teilnahme</span><span class="muted">${p.t}</span><span class="muted">davon „Eigener Kopf“</span><span class="muted">${p.k}</span><span class="muted">davon „Wie du“</span><span class="muted">${p.w}</span></div>
    <div class="row mt"><button class="btn grow" id="mpTeam" ${!imTeam && !teamPlatz(i).ok ? 'disabled' : ''}>${imTeam ? 'Aus dem Team nehmen' : 'Ins Fantasy-Team holen'}</button>${m.u ? `<a class="btn line" href="${esc(m.u)}" target="_blank" rel="noopener">Profil</a>` : ''}</div>
    ${!imTeam && !teamPlatz(i).ok ? `<p class="tiny muted">${teamPlatz(i).grund}</p>` : ''}
    <div class="vrow tiny muted" style="border-bottom:2px solid var(--line)"><span>Abstimmung</span><span class="center">Du</span><span class="center">${esc(m.n.split(' ').slice(-1)[0])}</span></div>
    ${zeilen}
    <button class="btn line block mt" id="zuB">Schließen</button>`);
  $('#zuB').onclick = blattZu;
  $('#mpTeam').onclick = () => { teamUmschalten(i); blattZu(); if (aktiverTab === 'team') renderTeam(); else toast(S.team.includes(m.m) ? 'Im Team' : 'Aus dem Team genommen'); };
}

// ---------- Tab 3: Fantasy-Team ----------
let teamSuche = '', teamFrak = '', teamSort = 'punkte';
const idx = new Map();
function mandatIndex(mid) { if (!idx.size) M.forEach((m, i) => idx.set(m.m, i)); return idx.get(mid); }
function teamIdx() { return S.team.map(mandatIndex).filter(i => i !== undefined); }
function teamPlatz(i) {
  const t = teamIdx();
  if (t.includes(i)) return { ok: true };
  if (t.length >= TEAMGROESSE) return { ok: false, grund: 'Dein Team ist voll (5 Abgeordnete).' };
  const f = M[i].f, n = t.filter(j => M[j].f === f).length;
  if (n >= MAX_JE_FRAKTION) return { ok: false, grund: `Höchstens ${MAX_JE_FRAKTION} aus einer Fraktion (${f}).` };
  return { ok: true };
}
function teamUmschalten(i) {
  const mid = M[i].m;
  if (S.team.includes(mid)) { S.team = S.team.filter(x => x !== mid); if (S.kapitaen === mid) S.kapitaen = null; }
  else { const p = teamPlatz(i); if (!p.ok) { toast(p.grund); return; } S.team.push(mid); if (!S.kapitaen) S.kapitaen = mid; }
  schreiben(LS.team, S.team); schreiben(LS.kapitaen, S.kapitaen);
}
function teamPunkte(t = teamIdx(), kap = S.kapitaen) {
  let sum = 0;
  for (const i of t) sum += PUNKTE[i].sum * (M[i].m === kap ? 2 : 1);
  return sum;
}
function bestesTeam() {
  const sort = AKTIV.slice().sort((a, b) => PUNKTE[b].sum - PUNKTE[a].sum);
  const t = [], cnt = {};
  for (const i of sort) { const f = M[i].f; if ((cnt[f] || 0) >= MAX_JE_FRAKTION) continue; t.push(i); cnt[f] = (cnt[f] || 0) + 1; if (t.length === TEAMGROESSE) break; }
  return { t, sum: teamPunkte(t, t[0] !== undefined ? M[t[0]].m : null) };
}
function sitzungstage() {
  const tage = new Map();
  P.forEach((a, k) => { if (!tage.has(a.dt)) tage.set(a.dt, []); tage.get(a.dt).push(k); });
  return [...tage.entries()]; // neueste zuerst
}

function renderTeam() {
  const v = $('#v-team');
  const t = teamIdx();
  const summe = teamPunkte();
  const best = bestesTeam();
  const tage = sitzungstage();
  const letzter = tage[0];
  const letzterPunkte = letzter ? t.reduce((s, i) => s + letzter[1].reduce((x, k) => x + punkteFuer(i, k).sum, 0) * (M[i].m === S.kapitaen ? 2 : 1), 0) : 0;

  const slots = Array.from({ length: TEAMGROESSE }, (_, k) => {
    const i = t[k];
    if (i === undefined) return `<button class="slot" data-leer="1"><span style="font-size:22px">＋</span>frei</button>`;
    const m = M[i], kap = m.m === S.kapitaen;
    return `<button class="slot full" data-mp="${i}"><span class="cap ${kap ? 'on' : ''}" data-kap="${m.m}" title="Kapitän">★</span><span class="avatar">${esc(initialen(m.n))}</span><span class="nm">${esc(m.n.split(' ').slice(-1)[0])}</span><span class="tiny muted trunc" style="max-width:100%">${esc(m.f)}</span><span class="pts">${PUNKTE[i].sum * (kap ? 2 : 1)}</span></button>`;
  }).join('');

  const q = teamSuche.trim().toLowerCase();
  let kandidaten = AKTIV.filter(i => (!teamFrak || M[i].f === teamFrak) && (!q || (M[i].n + ' ' + M[i].w + ' ' + M[i].l).toLowerCase().includes(q)));
  let zw = null;
  if (teamSort === 'zwilling') { zw = new Map(zwillinge().liste.map(r => [r.i, r.q])); kandidaten.sort((a, b) => (zw.get(b) ?? -1) - (zw.get(a) ?? -1)); }
  else if (teamSort === 'name') kandidaten.sort((a, b) => M[a].n.split(' ').slice(-1)[0].localeCompare(M[b].n.split(' ').slice(-1)[0]));
  else kandidaten.sort((a, b) => PUNKTE[b].sum - PUNKTE[a].sum);
  const zeige = kandidaten.slice(0, 40);

  v.innerHTML = `
    <div class="card">
      <div class="row"><div class="grow"><div class="small muted">Dein Fantasy-Bundestag</div><div class="score"><b>${summe}</b><span class="muted">Punkte</span></div></div>
      ${t.length ? `<button class="btn line" id="teilenT">Teilen</button>` : ''}</div>
      <div class="slots mt">${slots}</div>
      <div class="tiny muted mt">★ Kapitän zählt doppelt – tippe auf den Stern. Höchstens ${MAX_JE_FRAKTION} pro Fraktion.</div>
      ${t.length ? `<div class="kv mt"><span>Letzter Sitzungstag (${datum(letzter?.[0])})</span><span>+${letzterPunkte}</span><span>Bestmögliches Team</span><span>${best.sum}</span><span>Dein Team erreicht davon</span><span>${best.sum ? prozent(summe / best.sum) : '–'}</span></div>` : ''}
    </div>

    <details class="card mt"><summary>So gibt es Punkte</summary>
      <ul>
        <li><b>+2 Teilnahme</b> – bei jeder namentlichen Abstimmung mit Dafür, Dagegen oder Enthaltung.</li>
        <li><b>+3 Eigener Kopf</b> – anders gestimmt als die Mehrheit der eigenen Fraktion.</li>
        <li><b>+1 Wie du</b> – genauso gestimmt wie du im Tab „Abstimmen“.</li>
        <li><b>×2 Kapitän</b> – alle Punkte deines Kapitäns zählen doppelt.</li>
      </ul>
      <p>Gezählt wird die ganze laufende Wahlperiode, neue Abstimmungen kommen automatisch dazu. Die Punkte messen Beteiligung und Eigenständigkeit, nicht Inhalte oder Parteien. Fehlen kann gute Gründe haben, etwa Krankheit, Elternzeit oder Termine im Wahlkreis.</p>
    </details>

    <div class="card mt"><h3>Abgeordnete aufstellen</h3>
      <input type="search" id="tSuche" placeholder="Name, Wahlkreis oder Landesliste" value="${esc(teamSuche)}">
      <div class="row mt" style="margin-top:8px"><select id="tFrak"><option value="">Alle Fraktionen</option>${FRAK.map(f => `<option ${f === teamFrak ? 'selected' : ''}>${esc(f)}</option>`).join('')}</select></div>
      <div class="seg mt" style="margin-top:8px"><button data-sort="punkte" aria-pressed="${teamSort === 'punkte'}">Punkte</button><button data-sort="zwilling" aria-pressed="${teamSort === 'zwilling'}">Wie du</button><button data-sort="name" aria-pressed="${teamSort === 'name'}">Name</button></div>
      <div class="list mt">${zeige.map(i => {
        const m = M[i], drin = t.includes(i), pl = teamPlatz(i);
        const zusatz = teamSort === 'zwilling' && zw?.has(i) ? ` · ${prozent(zw.get(i))} wie du` : '';
        return `<div class="item"><button class="row grow" style="text-align:left;gap:12px" data-mp="${i}"><span class="avatar">${esc(initialen(m.n))}</span><span class="grow"><span class="trunc" style="display:block;font-weight:600">${esc(m.n)}</span><span class="small muted trunc" style="display:block">${esc(m.f)} · ${PUNKTE[i].sum} P.${zusatz}</span></span></button>
          <button class="addbtn ${drin ? 'on' : ''}" data-add="${i}" ${!drin && !pl.ok ? 'disabled' : ''} aria-label="${drin ? 'Entfernen' : 'Aufstellen'}">${drin ? '✓' : '+'}</button></div>`;
      }).join('') || '<div class="empty">Kein Treffer</div>'}</div>
      ${kandidaten.length > zeige.length ? `<p class="tiny muted center">${kandidaten.length - zeige.length} weitere – grenze die Suche ein.</p>` : ''}
    </div>

    <div class="card mt"><h3>Bestenliste der Wahlperiode</h3><div class="list">${AKTIV.slice().sort((a, b) => PUNKTE[b].sum - PUNKTE[a].sum).slice(0, 10).map((i, k) => `<button class="item" data-mp="${i}"><span class="rank">${k + 1}</span><span class="grow"><span class="trunc" style="display:block;font-weight:600">${esc(M[i].n)}</span><span class="small muted">${esc(M[i].f)} · Eigener Kopf ${PUNKTE[i].k}</span></span><span class="pct">${PUNKTE[i].sum}</span></button>`).join('')}</div></div>

    ${t.length ? `<div class="card mt"><h3>Sitzungstage</h3><div class="list">${tage.slice(0, 12).map(([dt, ks]) => {
      const pts = t.reduce((s, i) => s + ks.reduce((x, k) => x + punkteFuer(i, k).sum, 0) * (M[i].m === S.kapitaen ? 2 : 1), 0);
      return `<div class="item"><span class="grow"><b>${datum(dt)}</b><span class="small muted" style="display:block">${ks.length} Abstimmung${ks.length > 1 ? 'en' : ''}</span></span><span class="pct">+${pts}</span></div>`;
    }).join('')}</div></div>` : ''}`;

  v.querySelectorAll('[data-mp]').forEach(b => b.addEventListener('click', e => { if (e.target.closest('[data-kap]')) return; mpBlatt(+b.dataset.mp); }));
  v.querySelectorAll('[data-kap]').forEach(b => b.addEventListener('click', e => { e.stopPropagation(); S.kapitaen = +b.dataset.kap; schreiben(LS.kapitaen, S.kapitaen); renderTeam(); }));
  v.querySelectorAll('[data-leer]').forEach(b => b.addEventListener('click', () => $('#tSuche').focus()));
  v.querySelectorAll('[data-add]').forEach(b => b.addEventListener('click', () => { teamUmschalten(+b.dataset.add); renderTeam(); }));
  v.querySelectorAll('[data-sort]').forEach(b => b.addEventListener('click', () => { teamSort = b.dataset.sort; renderTeam(); }));
  $('#tFrak').onchange = e => { teamFrak = e.target.value; renderTeam(); };
  const ts = $('#tSuche');
  ts.addEventListener('input', () => { teamSuche = ts.value; const pos = ts.selectionStart; renderTeam(); const n = $('#tSuche'); n.focus(); n.setSelectionRange(pos, pos); });
  $('#teilenT')?.addEventListener('click', () => {
    const url = location.origin + location.pathname + '?team=' + S.team.join(',') + (S.kapitaen ? '&k=' + S.kapitaen : '');
    teilen(`Mein Fantasy-Bundestag hat ${summe} Punkte: ${t.map(i => M[i].n).join(', ')}. Schaffst du mehr?`, url);
  });
}

// geteiltes Team aus dem Link anzeigen
function geteiltesTeam() {
  const sp = new URLSearchParams(location.search);
  const ids = (sp.get('team') || '').split(',').map(Number).filter(Boolean);
  if (!ids.length) return;
  history.replaceState(null, '', location.pathname);
  const t = ids.map(mandatIndex).filter(i => i !== undefined).slice(0, TEAMGROESSE);
  if (!t.length) return;
  const kap = Number(sp.get('k')) || null;
  const sum = teamPunkte(t, kap);
  blatt(`<h2>Geteiltes Team</h2><div class="score"><b>${sum}</b><span class="muted">Punkte</span></div>
    <div class="list mt">${t.map(i => `<div class="item"><span class="avatar">${esc(initialen(M[i].n))}</span><span class="grow"><b>${esc(M[i].n)}</b>${M[i].m === kap ? ' ★' : ''}<span class="small muted" style="display:block">${esc(M[i].f)}</span></span><span class="pct">${PUNKTE[i].sum * (M[i].m === kap ? 2 : 1)}</span></div>`).join('')}</div>
    <div class="row mt"><button class="btn line grow" id="gtZu">Schließen</button><button class="btn grow" id="gtUeber">Team übernehmen</button></div>`);
  $('#gtZu').onclick = blattZu;
  $('#gtUeber').onclick = () => { S.team = t.map(i => M[i].m); S.kapitaen = kap && S.team.includes(kap) ? kap : S.team[0]; schreiben(LS.team, S.team); schreiben(LS.kapitaen, S.kapitaen); blattZu(); zeigeTab('team'); };
}

// ---------- Tab 4: Info ----------
function renderInfo() {
  const v = $('#v-info');
  const stand = D.erstellt ? new Date(D.erstellt).toLocaleString('de-DE', { dateStyle: 'medium', timeStyle: 'short' }) : '–';
  const aelteste = P[P.length - 1]?.dt, neueste = P[0]?.dt;
  v.innerHTML = `
    <div class="card"><h2>Über Plenum</h2>
      <p>Plenum nutzt echte <b>namentliche Abstimmungen</b> des Bundestags. Im Tab „Abstimmen“ stimmst du selbst ab, „Zwilling“ zeigt, wer tatsächlich so gestimmt hat wie du, und im „Team“ stellst du deinen Fantasy-Bundestag auf.</p>
      <div class="kv"><span>Wahlperiode</span><span>${esc(D.periode?.label || '–')}</span><span>Abstimmungen</span><span>${P.length}</span><span>Zeitraum</span><span>${datum(aelteste)} – ${datum(neueste)}</span><span>Abgeordnete</span><span>${AKTIV.length}</span><span>Datenstand</span><span>${stand}</span></div>
    </div>
    <div class="card mt"><h3>Quelle und Grenzen</h3>
      <p class="small">Alle Daten stammen von <a href="https://www.abgeordnetenwatch.de" target="_blank" rel="noopener">abgeordnetenwatch.de</a> (Lizenz CC0 1.0) und werden jede Nacht aktualisiert. Die Beschreibungen der Abstimmungen sind dort übernommen.</p>
      <p class="small">Namentliche Abstimmungen sind nur ein kleiner Teil aller Entscheidungen im Bundestag. Plenum ist kein Wahl-O-Mat und gibt keine Wahlempfehlung.</p>
      <p class="small">Deine Antworten und dein Team bleiben nur auf diesem Gerät.</p>
    </div>
    <div class="card mt"><h3>Als App installieren</h3><p class="small" id="installText">${installText()}</p><button class="btn ghost" id="installBtn" ${deferredPrompt ? '' : 'hidden'}>Jetzt installieren</button></div>
    <div class="card mt"><h3>Einstellungen</h3>
      <label class="row small" style="gap:10px"><input type="checkbox" id="auflosungCb" ${S.auflosung ? 'checked' : ''}> Nach jeder Antwort das echte Ergebnis zeigen</label>
      <button class="btn line block mt" id="alles">Alles zurücksetzen</button>
    </div>
    <p class="tiny muted center mt">Plenum ${APP_VERSION} · ein Prototyp von micana.de</p>`;
  $('#auflosungCb').onchange = e => { S.auflosung = e.target.checked; schreiben(LS.auflosung, S.auflosung); };
  $('#installBtn').onclick = installieren;
  $('#alles').onclick = () => { blatt(`<h2>Alles zurücksetzen?</h2><p class="muted">Antworten und Team werden gelöscht.</p><div class="row"><button class="btn line grow" id="abbr">Abbrechen</button><button class="btn grow" id="jaw" style="background:var(--nein)">Zurücksetzen</button></div>`); $('#abbr').onclick = blattZu; $('#jaw').onclick = () => { S.antworten = {}; S.team = []; S.kapitaen = null; [LS.antworten, LS.team, LS.kapitaen].forEach(k => schreiben(k, k === LS.antworten ? {} : k === LS.team ? [] : null)); punkteBerechnen(); blattZu(); zeigeTab('zwilling'); }; };
}

// ---------- Installation und Updates ----------
let deferredPrompt = null;
const istIOS = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const installiert = () => matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
function installText() {
  if (installiert()) return 'Plenum ist bereits installiert.';
  if (istIOS) return 'In Safari unten auf „Teilen“ tippen, dann „Zum Home-Bildschirm“.';
  return deferredPrompt ? 'Tippe auf „Jetzt installieren“.' : 'Im Browser-Menü „App installieren“ oder „Zum Startbildschirm hinzufügen“ wählen.';
}
async function installieren() { if (!deferredPrompt) return; deferredPrompt.prompt(); await deferredPrompt.userChoice.catch(() => {}); deferredPrompt = null; $('#installBanner').innerHTML = ''; }
function installBanner() {
  if (installiert() || lesen(LS.install, false) || (!deferredPrompt && !istIOS)) { $('#installBanner').innerHTML = ''; return; }
  $('#installBanner').innerHTML = `<div class="banner"><span class="grow">${istIOS ? 'Als App nutzen: „Teilen“ → „Zum Home-Bildschirm“' : 'Plenum als App installieren?'}</span>${deferredPrompt ? '<button class="btn" id="ibJa" style="padding:8px 12px">Installieren</button>' : ''}<button aria-label="Ausblenden" id="ibWeg" style="padding:6px;font-size:18px">✕</button></div>`;
  $('#ibJa')?.addEventListener('click', installieren);
  $('#ibWeg').onclick = () => { schreiben(LS.install, true); $('#installBanner').innerHTML = ''; };
}
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferredPrompt = e; installBanner(); });

function updateBanner(worker) {
  $('#updateBanner').innerHTML = `<div class="banner"><span class="grow">Neue Version von Plenum ist da.</span><button class="btn" id="upd" style="padding:8px 12px">Jetzt aktualisieren</button></div>`;
  $('#upd').onclick = () => { $('#upd').textContent = 'Lädt …'; $('#upd').disabled = true; worker.postMessage({ type: 'SKIP_WAITING' }); };
}
if ('serviceWorker' in navigator && location.protocol === 'https:') {
  navigator.serviceWorker.register('sw.js').then(reg => {
    if (reg.waiting && navigator.serviceWorker.controller) updateBanner(reg.waiting);
    reg.addEventListener('updatefound', () => {
      const w = reg.installing;
      w?.addEventListener('statechange', () => { if (w.state === 'installed' && navigator.serviceWorker.controller) updateBanner(w); });
    });
    setInterval(() => reg.update().catch(() => {}), 60 * 60 * 1000);
  }).catch(() => {});
  let neu = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (neu) return; neu = true; location.reload(); });
}

// ---------- Start ----------
(async function start() {
  try {
    D = await datenLaden();
    vorbereiten();
    $('#untertitel').textContent = `${P.length} echte Abstimmungen · ${esc(D.periode?.label || 'Bundestag')}`.replace(/&amp;/g, '&');
    $('#v-laden').classList.remove('on');
    $('#tabs').hidden = false;
    zeigeTab(beantwortet().length >= MIN_ANTWORTEN && !offeneKarten().length ? 'ergebnis' : 'zwilling');
    geteiltesTeam();
    installBanner();
  } catch (e) {
    console.error(e);
    $('#v-laden').innerHTML = `<div class="loading"><h2>Abstimmungen noch nicht da</h2><p class="muted" style="max-width:340px">Die Daten werden automatisch jede Nacht vorbereitet. Bitte versuche es in ein paar Minuten noch einmal.</p><button class="btn" onclick="location.reload()">Neu laden</button><p class="tiny muted">${esc(e.message || e)}</p></div>`;
  }
})();
</script>
</body>
</html>
